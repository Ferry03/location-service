services:
  local-db:
    image: mongo:7.0.12
    container_name: microservice2
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
  ihm-db:
    image: mongo-express:1.0.2-20
    container_name: ihm-microservice2
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_SERVER: local-db
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - local-db
volumes:
  mongo-data:
